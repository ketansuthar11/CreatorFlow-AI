services:
  - type: web
    name: ai-content-factory
    runtime: node
    plan: starter
    buildCommand: |
      python3 --version
      pip3 --version
      ffmpeg -version
      npm ci
      npx prisma generate
      npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET_JSON
        sync: false
      - key: APP_URL
        sync: false
