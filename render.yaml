services:
  - type: web
    name: ai-content-factory
    # Docker provides ffmpeg, yt-dlp, and Canvas' native system libraries.
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run start
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET_JSON
        sync: false
      - key: APP_URL
        sync: false
